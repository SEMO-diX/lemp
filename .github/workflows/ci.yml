name: Public LEMP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Test
        run: pytest -q
      - name: Build release artifacts
        run: |
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          python -m build
      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/lemp-0.1.0-py3-none-any.whl
          test -f dist/lemp-0.1.0.tar.gz

          release_venv="$RUNNER_TEMP/lemp-release-venv"
          demo_root="$RUNNER_TEMP/lemp-release-demo"
          validate_json="$RUNNER_TEMP/lemp-release-validate.json"

          python -m venv "$release_venv"
          "$release_venv/bin/python" -m pip install --disable-pip-version-check dist/lemp-0.1.0-py3-none-any.whl

          "$release_venv/bin/python" -c 'import importlib.metadata as m; assert m.version("lemp") == "0.1.0"'
          "$release_venv/bin/python" -c 'from lemp.template_data import DEFAULT_RUNTIME_SPEC; assert DEFAULT_RUNTIME_SPEC == "git+https://github.com/SEMO-diX/lemp.git@738d35931fc6f11fa9eeee68809253233f715fe8"'
          "$release_venv/bin/lemp" --help >/dev/null
          "$release_venv/bin/lemp" init "$demo_root"
          "$release_venv/bin/lemp" validate --root "$demo_root" --format json >"$validate_json"

          "$release_venv/bin/python" - "$validate_json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["integrity"] == "PASS", payload
          assert payload["checkpoint"] == "CP000001", payload
          assert payload["state_version"] == 1, payload
          assert payload["errors"] == [], payload
          PY
